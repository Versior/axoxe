  <rect x="880" y="554" width="344" height="86" rx="10" fill="#fff" stroke="#d9d6cd"/><text x="900" y="589" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#191917">SQLite + sqlite-vec</text><text x="900" y="616" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#65645d">Embedded database · vector search</text>
  <text x="56" y="680" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#65645d">Solid arrows show request / dependency flow.</text>
  <text x="56" y="705" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#65645d">Busen subscribers handle asynchronous side effects.</text>
</svg>