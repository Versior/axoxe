services:
  axoxe:
    image: axoxe:local
    build:
      context: ..
      dockerfile: docker/build.Dockerfile
      args:
        TARGETOS: linux
        TARGETARCH: ${AXOXE_TARGETARCH:-amd64}
    container_name: axoxe
    restart: unless-stopped
    mem_limit: 96m
    memswap_limit: 96m
    ports:
      - "6277:6277"
    volumes:
      - ./data:/app/data
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set a persistent JWT_SECRET before starting AXOXE}
